    <link rel="stylesheet" href="../shared/app.css">
    <script src="../shared/party-logic.js"></script>
    <style>
        #amida-wrap { overflow-x: auto; margin: 1em -0.5em; }
        #amida-canvas { display: block; margin: 0 auto; }
        #result-list { margin-top: 1.2em; text-align: left; display: none; }
        #result-list.show { display: block; }
        .result-row {
            display: flex; justify-content: space-between; gap: 10px;
            padding: 9px 12px; border: 1px solid var(--color-border); background: var(--color-panel);
            margin-bottom: 6px; font-weight: 700; font-size: 0.9rem;
        }
        .result-row .to { color: var(--color-gold); }
    </style>
</head>
<body>
    <nav class="app-nav">
        <a href="../index.html">← 余興アプリ一覧</a>
        <a class="brand" href="/">ことほぎ</a>
    </nav>

    <main class="card">
        <div class="ornament"><svg viewBox="0 0 24 24"><path d="M12 2L22 12L12 22L2 12L12 2Z"/></svg></div>
        <h1 class="app-title">Amidakuji</h1>
        <p class="app-subtitle">あみだくじ</p>
        <p class="app-lead">参加者と結果を入れて作成。役割分担・景品決め・順番決めに使えます。</p>

        <div class="howto-note" id="app-howto">
            <strong>使い方の要点（幹事・司会向け）</strong>
            <ol>
                <li>「参加者」と「結果」をそれぞれ1行に1つ入力します。</li>
                <li>「あみだを作る」で横線がランダムに引かれます。</li>
                <li>「結果を見る」で誰がどこに着くかを発表します。</li>
            </ol>
        </div>

        <div class="row">
            <div class="field">
                <label for="names-input">参加者（上）</label>
                <textarea id="names-input" placeholder="A&#10;B&#10;C&#10;D"></textarea>
            </div>
            <div class="field">
                <label for="results-input">結果（下）</label>
                <textarea id="results-input" placeholder="幹事&#10;乾杯&#10;受付&#10;写真"></textarea>
            </div>
        </div>

        <div id="amida-wrap">
            <canvas id="amida-canvas" width="320" height="360"></canvas>
        </div>

        <div class="stack">
            <button class="btn-gold" id="start-btn" type="button">あみだを作る</button>
            <button class="btn-ghost" id="reveal-btn" type="button">結果を見る</button>
        </div>

        <div id="result-list" aria-live="polite"></div>
    </main>

    <p class="app-footer">© <span id="year"></span> ことほぎ / <a href="/">Kotohogi</a></p>

    <script>
        "use strict";
        const P = window.PartyLogic;
        const canvas = document.getElementById("amida-canvas");
        const ctx = canvas.getContext("2d");
        const namesTa = document.getElementById("names-input");
        const resultsTa = document.getElementById("results-input");
        const LINES = ["#B4975A", "#1A1A1A", "#7A6A44", "#4A4A4A", "#C9B37E", "#5A4A2A"];
        let rungs = [];
        let width = 0;
        const H = 8; // 段数

        function lines(ta) { return ta.value.split("\n").map((s) => s.trim()).filter(Boolean); }

        function build() {
            const names = lines(namesTa);
            width = Math.max(2, names.length);
            rungs = P.generateLadder(width, H);
            document.getElementById("result-list").classList.remove("show");
            drawLadder();
        }

        function geometry() {
            const names = lines(namesTa);
            const results = lines(resultsTa);
            const w = Math.max(2, names.length);
            const colGap = Math.max(56, Math.min(90, 320 / w));
            const marginX = 30;
            const topY = 46;
            const botY = 320;
            canvas.width = marginX * 2 + colGap * (w - 1);
            canvas.height = botY + 30;
            return { names, results, w, colGap, marginX, topY, botY };
        }

        function xOf(g, col) { return g.marginX + col * g.colGap; }
        function yOfLevel(g, level) { return g.topY + ((level + 1) / (H + 1)) * (g.botY - g.topY); }

        function drawLadder(trace) {
            const g = geometry();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.font = "bold 13px 'Noto Serif JP', serif";
            ctx.textAlign = "center";
            // 縦線
            ctx.strokeStyle = "#DCD7D0"; ctx.lineWidth = 3;
            for (let c = 0; c < g.w; c++) {
                ctx.beginPath();
                ctx.moveTo(xOf(g, c), g.topY);
                ctx.lineTo(xOf(g, c), g.botY);
                ctx.stroke();
            }
            // 横線
            for (const r of rungs) {
                const y = yOfLevel(g, r.level);
                ctx.beginPath();
                ctx.moveTo(xOf(g, r.col), y);
                ctx.lineTo(xOf(g, r.col + 1), y);
                ctx.stroke();
            }
            // ラベル
            ctx.fillStyle = "#1A1A1A";
            for (let c = 0; c < g.w; c++) {
                const nm = g.names[c] || String(c + 1);
                ctx.fillText(nm.length > 5 ? nm.slice(0, 5) : nm, xOf(g, c), g.topY - 12);
                const rs = g.results[c] || "";
                ctx.fillStyle = "#B4975A";
                ctx.fillText(rs.length > 5 ? rs.slice(0, 5) : rs, xOf(g, c), g.botY + 20);
                ctx.fillStyle = "#1A1A1A";
            }
            if (trace) drawTraces(g);
        }

        function pathOf(startCol) {
            // 上 startCol から下までの折れ線（列の移動を段順にたどる）
            const g = geometry();
            const pts = [[xOf(g, startCol), g.topY]];
            let col = startCol;
            const sorted = rungs.slice().sort((a, b) => a.level - b.level);
            for (const r of sorted) {
                if (r.col === col || r.col + 1 === col) {
                    const y = yOfLevel(g, r.level);
                    pts.push([xOf(g, col), y]);
                    col = r.col === col ? col + 1 : col - 1;
                    pts.push([xOf(g, col), y]);
                }
            }
            pts.push([xOf(g, col), g.botY]);
            return pts;
        }

        function drawTraces(g) {
            for (let c = 0; c < g.w; c++) {
                const pts = pathOf(c);
                ctx.strokeStyle = LINES[c % LINES.length];
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                pts.forEach((p, i) => (i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1])));
                ctx.stroke();
            }
        }

        function reveal() {
            const g = geometry();
            if (rungs.length === 0 && g.names.length) build();
            const mapping = P.resolveLadder(Math.max(2, g.names.length), rungs);
            drawLadder(true);
            const box = document.getElementById("result-list");
            box.innerHTML = g.names.map((nm, i) => {
                const dest = mapping[i];
                const res = g.results[dest] || `${dest + 1}番目`;
                return `<div class="result-row"><span>${nm || (i + 1) + "番"}</span><span class="to">→ ${res}</span></div>`;
            }).join("");
            box.classList.add("show");
        }

        namesTa.addEventListener("input", build);
        resultsTa.addEventListener("input", () => drawLadder());
        document.getElementById("start-btn").addEventListener("click", build);
        document.getElementById("reveal-btn").addEventListener("click", reveal);
        document.getElementById("year").textContent = new Date().getFullYear();

        namesTa.value = "A\nB\nC\nD";
        resultsTa.value = "幹事\n乾杯\n受付\n写真";
        build();
    </script>
    <script src="/cf-web-analytics.js" defer></script>
</body>
</html>

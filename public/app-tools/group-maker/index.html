<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グループ分け・チーム分けメーカー（ランダム） | ことほぎ</title>
    <meta name="description" content="名前を入れてボタンを押すだけで、公平にランダムなチーム分け・グループ分けができます。人数指定でもグループ数指定でもOK。結婚式の余興・二次会・忘年会・イベントに。無料・登録不要。">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://kotohogi.nozoisfun.workers.dev/app-tools/group-maker/index.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="ことほぎ">
    <meta property="og:title" content="グループ分け・チーム分けメーカー | ことほぎ">
    <meta property="og:description" content="名前を入れて押すだけで公平にランダムなチーム分け。人数でもグループ数でも指定OK。無料・登録不要。">
    <meta property="og:url" content="https://kotohogi.nozoisfun.workers.dev/app-tools/group-maker/index.html">
    <meta property="og:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="グループ分け・チーム分けメーカー | ことほぎ">
    <meta name="twitter:description" content="名前を入れて押すだけで公平にランダムなチーム分け。人数でもグループ数でも指定OK。">
    <meta name="twitter:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/app.css">
    <script src="../shared/party-logic.js"></script>
    <script src="../shared/ui.js"></script>
    <style>
        #groups { margin-top: 1.4em; display: grid; gap: 12px; text-align: left; }
        .group-card { border: 1px solid var(--color-border); background: var(--color-panel); padding: 12px 14px; }
        .group-card h3 {
            margin: 0 0 8px; font-family: 'Playfair Display', serif; color: var(--color-gold);
            font-size: 1.1rem; letter-spacing: 0.04em; display: flex; justify-content: space-between;
        }
        .group-card h3 small { color: var(--color-text-light); font-weight: 400; font-size: 0.7rem; }
        .member-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .member-tags span { background: #fff; border: 1px solid var(--color-border); padding: 4px 10px; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="app-nav">
        <a href="../index.html">← 余興アプリ一覧</a>
        <a class="brand" href="/">ことほぎ</a>
    </nav>

    <main class="card">
        <div class="ornament"><svg viewBox="0 0 24 24"><path d="M12 2L22 12L12 22L2 12L12 2Z"/></svg></div>
        <h1 class="app-title">Group Maker</h1>
        <p class="app-subtitle">グループ分け・チーム分け</p>
        <p class="app-lead">名前を入れて押すだけ。できるだけ均等に、公平なチームをランダムに作ります。</p>

        <div class="howto-note" id="app-howto">
            <strong>使い方の要点（幹事・司会向け）</strong>
            <ol>
                <li>参加者を1行に1名ずつ入力します。</li>
                <li>「グループ数」か「1組の人数」のどちらで分けるか選びます。</li>
                <li>「チーム分けする」で、均等に近い形でランダム配分します（Ctrl+Enter でも実行）。</li>
                <li>できたチームは「結果をコピー」でそのまま共有できます。</li>
            </ol>
        </div>

        <div class="field">
            <label for="names-input">参加者（1行に1名）</label>
            <textarea id="names-input" placeholder="たろう&#10;はなこ&#10;じろう&#10;さくら&#10;けんた&#10;ゆい"></textarea>
            <p class="count-hint" id="names-count"></p>
            <p class="inline-error" id="names-error" role="alert" hidden></p>
        </div>

        <div class="row">
            <div class="field">
                <label for="mode-select">分け方</label>
                <select id="mode-select">
                    <option value="groups">グループ数で分ける</option>
                    <option value="size">1組の人数で分ける</option>
                </select>
            </div>
            <div class="field">
                <label for="count-input" id="count-label">グループ数</label>
                <input type="number" id="count-input" min="1" value="2">
            </div>
        </div>

        <button class="btn-gold" id="split-btn" type="button">チーム分けする</button>

        <div id="groups" aria-live="polite"></div>

        <div class="result-actions" id="group-actions" hidden>
            <button class="btn-ghost" id="copy-btn" type="button">結果をコピー</button>
        </div>
    </main>

    <p class="app-footer">© <span id="year"></span> ことほぎ / <a href="/">Kotohogi</a></p>

    <script>
        "use strict";
        const P = window.PartyLogic;
        const U = window.PartyUI;
        const KEY = "groupMakerNames";
        const MIN = 2;
        const namesTa = document.getElementById("names-input");
        const modeSel = document.getElementById("mode-select");
        const countIn = document.getElementById("count-input");
        const splitBtn = document.getElementById("split-btn");
        const actions = document.getElementById("group-actions");
        let lastGroups = [];

        function parsed() { return U.parseLines(namesTa.value); }

        function updateLabel() {
            const byGroups = modeSel.value === "groups";
            document.getElementById("count-label").textContent = byGroups ? "グループ数" : "1組の人数";
            countIn.max = byGroups ? Math.max(1, parsed().count) : 99;
        }

        function syncInputState() {
            const { count, duplicates } = parsed();
            const parts = ["参加者 " + U.formatCount(count, "名")];
            if (count >= MIN) {
                const n = Math.max(1, parseInt(countIn.value, 10) || 1);
                parts.push(modeSel.value === "groups"
                    ? "→ " + Math.min(n, count) + "チーム"
                    : "→ " + Math.ceil(count / n) + "チーム");
            }
            if (duplicates.length) parts.push("同じ名前が複数あります: " + duplicates.join("、"));
            U.setHint("names-count", parts.join(" ／ "));
            splitBtn.disabled = count < MIN;
            if (count >= MIN) U.clearError("names-error");
        }

        function split() {
            const { items, count } = parsed();
            if (count < MIN) {
                U.setError("names-error", "参加者を" + MIN + "名以上入力してください。いまは " + count + "名です。");
                namesTa.focus();
                return;
            }
            U.clearError("names-error");
            localStorage.setItem(KEY, namesTa.value);
            const n = Math.max(1, parseInt(countIn.value, 10) || 1);
            lastGroups = modeSel.value === "groups"
                ? P.splitIntoGroups(items, n)
                : P.splitBySize(items, n);
            render(lastGroups);
            actions.hidden = false;
        }

        function render(groups) {
            const box = document.getElementById("groups");
            box.innerHTML = groups.map((g, i) => `
                <div class="group-card">
                    <h3>チーム ${i + 1} <small>${g.length}名</small></h3>
                    <div class="member-tags">${g.map((m) => `<span>${U.escapeHtml(m)}</span>`).join("")}</div>
                </div>
            `).join("");
        }

        modeSel.addEventListener("change", () => { updateLabel(); syncInputState(); });
        countIn.addEventListener("input", syncInputState);
        namesTa.addEventListener("input", () => {
            updateLabel();
            syncInputState();
            localStorage.setItem(KEY, namesTa.value);
        });
        namesTa.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); split(); }
        });
        splitBtn.addEventListener("click", split);
        document.getElementById("copy-btn").addEventListener("click", () => {
            if (!lastGroups.length) return;
            U.copyWithToast(U.formatGroups(lastGroups), "チーム分けをコピーしました");
        });
        U.initFooterYear();

        const saved = localStorage.getItem(KEY);
        namesTa.value = saved != null ? saved : "たろう\nはなこ\nじろう\nさくら\nけんた\nゆい";
        updateLabel();
        syncInputState();
    </script>
    <script src="/cf-web-analytics.js" defer></script>
</body>
</html>

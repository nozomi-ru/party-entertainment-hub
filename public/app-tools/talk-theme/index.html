<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トークテーマガチャ（会話ネタ・質問） | ことほぎ</title>

    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://kotohogi.nozoisfun.workers.dev/app-tools/talk-theme/index.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="ことほぎ">
    <meta property="og:title" content="トークテーマガチャ | ことほぎ">
    <meta property="og:description" content="押すだけで会話ネタ・質問がランダムに出るガチャ。アイスブレイク・沈黙対策に。無料・登録不要。">
    <meta property="og:url" content="https://kotohogi.nozoisfun.workers.dev/app-tools/talk-theme/index.html">
    <meta property="og:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="トークテーマガチャ | ことほぎ">
    <meta name="twitter:description" content="押すだけで会話ネタ・質問がランダムに出るガチャ。アイスブレイク・沈黙対策に。">
    <meta name="twitter:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/app.css">
    <script src="../shared/party-logic.js"></script>
    <style>
        #theme-display {
            min-height: 120px; display: flex; align-items: center; justify-content: center;
            padding: 1.6em 1.2em; margin: 1em 0; border: 2px solid var(--color-gold); background: var(--color-surface);
            font-size: 1.25rem; font-weight: 700; line-height: 1.7;
        }
        #theme-display.flash { opacity: 0.4; }
    </style>
</head>
<body>
    <nav class="app-nav">
        <a href="../index.html">← 余興アプリ一覧</a>
        <a class="brand" href="/">ことほぎ</a>
    </nav>

    <main class="card">
        <div class="ornament"><svg viewBox="0 0 24 24"><path d="M12 2L22 12L12 22L2 12L12 2Z"/></svg></div>
        <h1 class="app-title">Talk Theme</h1>
        <p class="app-subtitle">トークテーマガチャ</p>
        <p class="app-lead">押すだけで会話ネタが出るガチャ。初対面のアイスブレイクや沈黙対策に。</p>

        <div class="howto-note" id="app-howto">
            <strong>使い方の要点（幹事・司会向け）</strong>
            <ol>
                <li>カテゴリを選ぶか、下の欄で自分のネタに差し替えます。</li>
                <li>「テーマを引く」でランダムに1つ表示します。</li>
                <li>テーブルごとに順番に引いて話すと、自然と会話が続きます。</li>
            </ol>
        </div>

        <div class="field">
            <label for="category-select">カテゴリ</label>
            <select id="category-select"></select>
        </div>

        <div id="theme-display" aria-live="polite">ボタンを押してテーマを引いてください</div>

        <button class="btn-gold" id="draw-btn" type="button">テーマを引く</button>

        <details style="margin-top:1.4em; text-align:left;">
            <summary class="muted" style="cursor:pointer;">この一覧を編集（1行に1つ）</summary>
            <textarea id="custom-input" style="margin-top:8px;" rows="7"></textarea>
        </details>
    </main>

    <p class="app-footer">© <span id="year"></span> ことほぎ / <a href="/">Kotohogi</a></p>

    <script>
        "use strict";
        const P = window.PartyLogic;
        const CUSTOM_KEY = "talkThemeCustom";
        const CATEGORIES = {
            "結婚式・二次会": [
                "新郎新婦との出会い・思い出は？",
                "今日のお祝いのひと言をどうぞ",
                "二人にプレゼントしたいものは？",
                "自分の結婚式でやりたい（やった）演出は？",
                "新郎新婦の第一印象は？",
                "二人に似ている有名人は？",
            ],
            "アイスブレイク": [
                "最近ハマっていることは？",
                "行ってみたい国・場所は？",
                "子どもの頃の夢は？",
                "自分を動物に例えると？",
                "最近一番笑ったことは？",
                "休日の過ごし方は？",
            ],
            "ちょっと深い質問": [
                "人生で一番の決断は？",
                "尊敬している人は？",
                "10年後どうなっていたい？",
                "自分の好きなところは？",
                "もらって嬉しかった言葉は？",
                "今年やり遂げたいことは？",
            ],
            "盛り上がる質問": [
                "宝くじで3億円当たったら？",
                "1日だけ別人になれるなら誰？",
                "無人島に1つ持っていくなら？",
                "透明人間になったら何する？",
                "今すぐ食べたいものは？",
                "タイムマシンで行くなら過去？未来？",
            ],
        };

        const sel = document.getElementById("category-select");
        const custom = document.getElementById("custom-input");
        Object.keys(CATEGORIES).forEach((k) => {
            const opt = document.createElement("option");
            opt.value = k; opt.textContent = k; sel.appendChild(opt);
        });

        function currentList() {
            const c = custom.value.split("\n").map((s) => s.trim()).filter(Boolean);
            return c.length ? c : CATEGORIES[sel.value];
        }

        function syncCustom() {
            custom.value = CATEGORIES[sel.value].join("\n");
        }

        function draw() {
            const list = currentList();
            const display = document.getElementById("theme-display");
            display.classList.add("flash");
            let ticks = 0;
            const timer = setInterval(() => {
                display.textContent = list[Math.floor(Math.random() * list.length)];
                if (++ticks >= 8) {
                    clearInterval(timer);
                    display.classList.remove("flash");
                    const { value } = P.drawOne(list);
                    display.textContent = value;
                }
            }, 60);
        }

        sel.addEventListener("change", () => { syncCustom(); localStorage.setItem(CUSTOM_KEY, custom.value); });
        custom.addEventListener("input", () => localStorage.setItem(CUSTOM_KEY, custom.value));
        document.getElementById("draw-btn").addEventListener("click", draw);
        document.getElementById("year").textContent = new Date().getFullYear();

        const savedCustom = localStorage.getItem(CUSTOM_KEY);
        if (savedCustom != null) custom.value = savedCustom; else syncCustom();
    </script>
    <script src="/cf-web-analytics.js" defer></script>
</body>
</html>

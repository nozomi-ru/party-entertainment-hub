<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽選ルーレット（名前・景品をランダムに1つ選ぶ） | ことほぎ</title>
    <meta name="description" content="名前や景品を入力して回すだけの抽選ルーレット。当選者をランダムに1人選べます。結婚式の余興・二次会・パーティー・忘年会のプレゼント抽選に。無料・登録不要・スマホOK。">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="https://kotohogi.nozoisfun.workers.dev/app-tools/roulette/index.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:site_name" content="ことほぎ">
    <meta property="og:title" content="抽選ルーレット | ことほぎ">
    <meta property="og:description" content="名前や景品を入れて回すだけ。当選者をランダムに1人選べる抽選ルーレット。無料・登録不要。">
    <meta property="og:url" content="https://kotohogi.nozoisfun.workers.dev/app-tools/roulette/index.html">
    <meta property="og:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="抽選ルーレット | ことほぎ">
    <meta name="twitter:description" content="名前や景品を入れて回すだけ。当選者をランダムに1人選べる抽選ルーレット。">
    <meta name="twitter:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/app.css">
    <script src="../shared/party-logic.js"></script>
    <script src="../shared/ui.js"></script>
    <style>
        .wheel-wrap {
            position: relative; width: 280px; max-width: 82vw; margin: 0.6em auto 1em;
            transition: filter 0.3s;
        }
        .wheel-wrap.spinning {
            filter: drop-shadow(0 0 14px rgba(180,151,90,0.7));
        }
        #wheel { width: 100%; height: auto; display: block; }
        .wheel-pointer {
            position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 20px solid var(--color-text); z-index: 2;
            transition: border-top-color 0.05s;
        }
        .wheel-pointer.tick {
            border-top-color: var(--color-gold);
            animation: pointer-tick 0.12s ease-out forwards;
        }
        @keyframes pointer-tick {
            0%   { transform: translateX(-50%) scaleY(1.5); }
            100% { transform: translateX(-50%) scaleY(1); }
        }
        .wheel-hub {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 44px; height: 44px; border-radius: 50%; background: var(--color-surface);
            border: 2px solid var(--color-gold); z-index: 2;
            transition: box-shadow 0.3s;
        }
        .wheel-wrap.spinning .wheel-hub {
            box-shadow: 0 0 0 4px rgba(180,151,90,0.3);
        }
        #winner-history { margin-top: 1.2em; text-align: left; }
        #winner-history h2 {
            font-family: 'Playfair Display', serif; font-size: 0.85rem; color: var(--color-gold);
            letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 8px;
        }
        #winner-history ol { margin: 0; padding-left: 1.4em; font-size: 0.9rem; font-weight: 600; }
        #winner-history li { margin-bottom: 4px; }

        /* 当選発表 */
        .result-box.winner-reveal {
            animation: winner-pop 0.55s cubic-bezier(0.17, 0.89, 0.32, 1.28) both;
        }
        @keyframes winner-pop {
            from { opacity: 0; transform: scale(0.5); }
            to   { opacity: 1; transform: scale(1); }
        }
        .result-big.winner-glow {
            animation: winner-name-glow 0.7s ease 3;
        }
        @keyframes winner-name-glow {
            0%, 100% { text-shadow: none; }
            50%      { text-shadow: 0 0 20px rgba(180,151,90,0.9); color: var(--color-gold); }
        }

        /* コンフェッティ */
        #confetti-canvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999; display: none;
        }
    </style>
</head>
<body>
    <nav class="app-nav">
        <a href="/#tools">← ツール一覧</a>
        <a class="brand" href="/">ことほぎ</a>
    </nav>

    <main class="card">
        <div class="ornament"><svg viewBox="0 0 24 24"><path d="M12 2L22 12L12 22L2 12L12 2Z"/></svg></div>
        <h1 class="app-title">Roulette</h1>
        <p class="app-subtitle">抽選ルーレット</p>
        <p class="app-lead">名前や景品を入れて回すだけ。当選者をランダムに1人選べます。</p>

        <div class="howto-note" id="app-howto">
            <strong>使い方の要点（幹事・司会向け）</strong>
            <ol>
                <li>1行に1つずつ、名前や景品名を入力します。</li>
                <li>「回す」でルーレットが回転し、当選を1つ選びます。</li>
                <li>当選者を外して続けたいときは「当選を除いて続ける」を押します。</li>
                <li>当選の並びは下に残るので、複数本の抽選でも読み上げ直せます。</li>
            </ol>
        </div>

        <div class="field">
            <label for="names-input">候補（1行に1つ）</label>
            <textarea id="names-input" placeholder="たろう&#10;はなこ&#10;じろう&#10;さくら"></textarea>
            <p class="count-hint" id="names-count"></p>
            <p class="inline-error" id="names-error" role="alert" hidden></p>
        </div>

        <div class="wheel-wrap">
            <div class="wheel-pointer"></div>
            <div class="wheel-hub"></div>
            <canvas id="wheel" width="280" height="280"></canvas>
        </div>

        <div class="result-box" id="winner-box" style="display:none;">
            <p class="tag">当選</p>
            <p class="result-big" id="winner">–</p>
        </div>

        <div class="stack">
            <button class="btn-gold" id="spin-btn" type="button">回す</button>
            <button class="btn-ghost" id="remove-btn" type="button" style="display:none;">当選を除いて続ける</button>
        </div>

        <div id="winner-history" aria-live="polite" hidden>
            <h2>当選の記録</h2>
            <ol id="winner-history-list"></ol>
            <div class="result-actions">
                <button class="btn-ghost" id="copy-btn" type="button">記録をコピー</button>
                <button class="btn-ghost" id="clear-history-btn" type="button">記録を消す</button>
            </div>
        </div>
    </main>

    <canvas id="confetti-canvas" aria-hidden="true"></canvas>
    <p class="app-footer">© <span id="year"></span> ことほぎ / <a href="/">Kotohogi</a></p>

    <script>
        "use strict";
        const P = window.PartyLogic;
        const U = window.PartyUI;
        const KEY = "rouletteNames";
        const MIN = 2;
        const COLORS = ["#B4975A", "#1A1A1A", "#C9B37E", "#4A4A4A", "#E0D3AE", "#7A6A44"];
        const CONFETTI_COLORS = ["#B4975A", "#FFD700", "#FFFFFF", "#C9B37E", "#E0D3AE", "#4A4A4A", "#F5E6C8"];
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const ta = document.getElementById("names-input");
        const spinBtn = document.getElementById("spin-btn");
        const removeBtn = document.getElementById("remove-btn");
        const wheelWrap = document.querySelector(".wheel-wrap");
        const pointer = document.querySelector(".wheel-pointer");
        let angle = 0;
        let spinning = false;
        let currentWinnerIdx = -1;
        // 抽選後にリストを編集されても取り違えないよう、位置ではなく当選した値を覚える
        let lastWinner = null;
        let history = [];

        /* ── イージング ── */
        // quintic ease-out: ラスト30%が極端に遅くなり「ドキドキ感」が出る
        function spinEase(t) {
            return 1 - Math.pow(1 - t, 5);
        }

        function items() { return U.parseLines(ta.value).items; }

        function syncInputState() {
            const { count, duplicates } = U.parseLines(ta.value);
            const parts = ["候補 " + U.formatCount(count, "件")];
            if (duplicates.length) parts.push("同じ名前が複数あります: " + duplicates.join("、"));
            U.setHint("names-count", parts.join(" ／ "));
            spinBtn.disabled = spinning || count < MIN;
            if (count >= MIN) U.clearError("names-error");
        }

        function renderHistory() {
            const box = document.getElementById("winner-history");
            box.hidden = history.length === 0;
            document.getElementById("winner-history-list").innerHTML =
                history.map((name) => `<li>${U.escapeHtml(name)}</li>`).join("");
        }

        /* ── キャンバス描画 ── */
        function draw() {
            const list = items();
            const size = canvas.width;
            const cx = size / 2, cy = size / 2, r = size / 2 - 4;
            ctx.clearRect(0, 0, size, size);
            if (list.length === 0) {
                ctx.fillStyle = "#F8F7F5";
                ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = "#9A948B"; ctx.font = "14px 'Noto Serif JP', serif";
                ctx.textAlign = "center"; ctx.fillText("候補を入力", cx, cy);
                return;
            }
            const seg = (Math.PI * 2) / list.length;
            list.forEach((name, i) => {
                const start = angle + i * seg;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, start + seg);
                ctx.closePath();
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(start + seg / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 13px 'Noto Serif JP', serif";
                const label = name.length > 8 ? name.slice(0, 8) + "…" : name;
                ctx.fillText(label, r - 12, 5);
                ctx.restore();
            });

            // 停止後は当選セグメントをゴールドでオーバーレイ
            if (!spinning && currentWinnerIdx >= 0 && currentWinnerIdx < list.length) {
                const start = angle + currentWinnerIdx * seg;
                ctx.save();
                ctx.shadowColor = "#FFD700";
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, start, start + seg);
                ctx.closePath();
                ctx.fillStyle = "rgba(255, 215, 0, 0.28)";
                ctx.fill();
                ctx.strokeStyle = "#FFD700";
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.restore();
            }

            ctx.strokeStyle = "#DCD7D0"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        }

        /* ── ポインターをティック ── */
        function flashPointer() {
            pointer.classList.remove("tick");
            void pointer.offsetWidth; // reflow
            pointer.classList.add("tick");
        }

        /* ── コンフェッティ ── */
        function launchConfetti() {
            const overlay = document.getElementById("confetti-canvas");
            overlay.style.display = "block";
            overlay.width = window.innerWidth;
            overlay.height = window.innerHeight;
            const oc = overlay.getContext("2d");
            const W = overlay.width, H = overlay.height;
            const particles = Array.from({ length: 90 }, () => ({
                x: W * 0.2 + Math.random() * W * 0.6,
                y: -20 - Math.random() * 80,
                vx: (Math.random() - 0.5) * 6,
                vy: Math.random() * 4 + 2,
                w: Math.random() * 12 + 5,
                h: Math.random() * 7 + 3,
                rot: Math.random() * Math.PI * 2,
                rotV: (Math.random() - 0.5) * 0.25,
                color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
            }));
            const start = performance.now();
            const duration = 2800;

            function confettiFrame(now) {
                const t = Math.min((now - start) / duration, 1);
                oc.clearRect(0, 0, W, H);
                const alpha = t > 0.65 ? 1 - (t - 0.65) / 0.35 : 1;
                particles.forEach((p) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.12;
                    p.rot += p.rotV;
                    oc.save();
                    oc.globalAlpha = alpha;
                    oc.translate(p.x, p.y);
                    oc.rotate(p.rot);
                    oc.fillStyle = p.color;
                    oc.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    oc.restore();
                });
                if (t < 1) {
                    requestAnimationFrame(confettiFrame);
                } else {
                    overlay.style.display = "none";
                }
            }
            requestAnimationFrame(confettiFrame);
        }

        /* ── 当選確定 ── */
        function finishSpin(list, winnerIdx) {
            spinning = false;
            currentWinnerIdx = winnerIdx;
            lastWinner = list[winnerIdx];
            history.push(lastWinner);
            wheelWrap.classList.remove("spinning");
            draw(); // 当選ハイライト描画

            // 当選ボックスをアニメーションで表示
            const box = document.getElementById("winner-box");
            const nameEl = document.getElementById("winner");
            nameEl.textContent = lastWinner;
            box.style.display = "block";
            box.classList.remove("winner-reveal");
            void box.offsetWidth;
            box.classList.add("winner-reveal");

            // 名前テキストをグロー
            nameEl.classList.remove("winner-glow");
            void nameEl.offsetWidth;
            nameEl.classList.add("winner-glow");

            removeBtn.style.display = "block";
            renderHistory();
            syncInputState();

            // コンフェッティ（reduced motion は除く）
            if (!U.prefersReducedMotion()) {
                setTimeout(launchConfetti, 150);
            }
        }

        /* ── スピン開始 ── */
        function spin() {
            if (spinning) return;
            const list = items();
            if (list.length < MIN) {
                U.setError("names-error", "候補を" + MIN + "つ以上入力してください。いまは " + list.length + "件です。");
                ta.focus();
                return;
            }
            U.clearError("names-error");
            localStorage.setItem(KEY, ta.value);
            spinning = true;
            currentWinnerIdx = -1;
            spinBtn.disabled = true;
            document.getElementById("winner-box").style.display = "none";
            removeBtn.style.display = "none";
            wheelWrap.classList.add("spinning");

            const seg = (Math.PI * 2) / list.length;
            const winnerIdx = Math.floor(Math.random() * list.length);
            // ポインタ（真上 = -90度）に winner の中央が来るように最終角度を決める
            const target = (-Math.PI / 2) - (winnerIdx * seg + seg / 2);
            const turns = 6 + Math.floor(Math.random() * 4); // 6〜9周
            const finalAngle = target - turns * Math.PI * 2;
            const startAngle = angle;
            const duration = U.prefersReducedMotion() ? 400 : 5000;
            const t0 = performance.now();

            let lastTickSeg = -1;

            function frame(now) {
                const p = Math.min(1, (now - t0) / duration);
                const eased = spinEase(p);
                angle = startAngle + (finalAngle - startAngle) * eased;

                // セグメント境界を跨いだときポインターをティック
                if (list.length > 1) {
                    const normalizedAngle = (((-angle - Math.PI / 2) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
                    const curSeg = Math.floor(normalizedAngle / seg) % list.length;
                    if (curSeg !== lastTickSeg && lastTickSeg !== -1) {
                        flashPointer();
                    }
                    lastTickSeg = curSeg;
                }

                draw();
                if (p < 1) {
                    requestAnimationFrame(frame);
                } else {
                    finishSpin(list, winnerIdx);
                }
            }
            requestAnimationFrame(frame);
        }

        /* ── 当選を除いて続ける ── */
        function removeWinner() {
            if (lastWinner == null) return;
            const list = items();
            const idx = list.indexOf(lastWinner);
            if (idx < 0) {
                U.toast("その候補はもうリストにありません");
            } else {
                list.splice(idx, 1);
                ta.value = list.join("\n");
                localStorage.setItem(KEY, ta.value);
            }
            lastWinner = null;
            currentWinnerIdx = -1;
            angle = 0;
            document.getElementById("winner-box").style.display = "none";
            removeBtn.style.display = "none";
            draw();
            syncInputState();
        }

        ta.addEventListener("input", () => {
            if (!spinning) { currentWinnerIdx = -1; draw(); }
            syncInputState();
            localStorage.setItem(KEY, ta.value);
        });
        spinBtn.addEventListener("click", spin);
        removeBtn.addEventListener("click", removeWinner);
        document.getElementById("copy-btn").addEventListener("click", () => {
            if (!history.length) return;
            U.copyWithToast(U.formatNumberedList(history), "当選の記録をコピーしました");
        });
        document.getElementById("clear-history-btn").addEventListener("click", () => {
            history = [];
            renderHistory();
            U.toast("当選の記録を消しました");
        });
        U.initFooterYear();

        const saved = localStorage.getItem(KEY);
        ta.value = saved != null ? saved : "たろう\nはなこ\nじろう\nさくら";
        draw();
        syncInputState();
    </script>
    <script src="/cf-web-analytics.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王様ゲーム（番号カード＋指令） | ことほぎ</title>
    <meta name="description" content="スマホ1台でできる王様ゲーム。人数分の番号をランダムに配り、王様と指令をその場で決定。カードをタップして自分の番号を確認できます。二次会・パーティー・合コン・飲み会の盛り上げに。無料・登録不要。">

    <meta property="og:site_name" content="ことほぎ">
    <meta property="og:title" content="王様ゲーム | ことほぎ">
    <meta property="og:description" content="スマホ1台でできる王様ゲーム。番号をランダムに配り、王様と指令をその場で決定。無料・登録不要。">
    <meta property="og:url" content="https://kotohogi.nozoisfun.workers.dev/app-tools/king-game/index.html">
    <meta property="og:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="王様ゲーム | ことほぎ">
    <meta name="twitter:description" content="スマホ1台でできる王様ゲーム。番号をランダムに配り、王様と指令をその場で決定。">
    <meta name="twitter:image" content="https://kotohogi.nozoisfun.workers.dev/og.jpg">
    <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/app.css">
    <script src="../shared/party-logic.js"></script>
    <script src="../shared/ui.js"></script>
    <style>
        #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; margin-top: 1.4em; }
        .king-card {
            aspect-ratio: 3/4; border: 1px solid var(--color-gold); background: var(--color-text);
            color: var(--color-gold-soft); display: flex; flex-direction: column; align-items: center;
            justify-content: center; cursor: pointer; font-weight: 700; position: relative; user-select: none;
        }
        .king-card .back { font-family: 'Playfair Display', serif; font-size: 1.4rem; letter-spacing: 0.05em; }
        .king-card.revealed { background: var(--color-surface); color: var(--color-text); border-color: var(--color-gold); }
        .king-card .seat { font-size: 0.62rem; color: var(--color-text-light); position: absolute; top: 6px; }
        .king-card .num { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; display: none; }
        .king-card.revealed .num { display: block; }
        .king-card.revealed .back { display: none; }
        .king-card.is-king.revealed { background: var(--color-gold); color: #fff; }
        .king-card .crown { display: none; font-size: 0.7rem; position: absolute; bottom: 6px; }
        .king-card.is-king.revealed .crown { display: block; }
    </style>
</head>
<body>
    <nav class="app-nav">
        <a href="../index.html">← 余興アプリ一覧</a>
        <a class="brand" href="/">ことほぎ</a>
    </nav>

    <main class="card">
        <div class="ornament"><svg viewBox="0 0 24 24"><path d="M12 2L22 12L12 22L2 12L12 2Z"/></svg></div>
        <h1 class="app-title">King Game</h1>
        <p class="app-subtitle">王様ゲーム</p>
        <p class="app-lead">スマホ1台で番号を配り、王様と指令をその場で決定。回して自分の番号を確認。</p>

        <div class="howto-note" id="app-howto">
            <strong>使い方の要点（幹事・司会向け）</strong>
            <ol>
                <li>人数を入れて「番号を配る」を押します。</li>
                <li>スマホを回して、各自カードをタップし自分の番号だけ確認します。</li>
                <li>「王様と指令を決める」で王様の番号と指令を発表します。</li>
                <li>次の回に移るときは「すべて隠す」→「番号を配る」で仕切り直せます。</li>
            </ol>
        </div>

        <div class="row">
            <div class="field">
                <label for="count-input">人数</label>
                <input type="number" id="count-input" min="2" max="30" value="6" inputmode="numeric">
            </div>
            <div class="field" style="display:flex;align-items:flex-end;">
                <button class="btn-gold" id="deal-btn" type="button">番号を配る</button>
            </div>
        </div>
        <p class="count-hint" id="count-hint"></p>

        <div id="cards" aria-label="番号カード"></div>

        <div class="row" style="margin-top:10px;">
            <button class="btn-ghost" id="reveal-all-btn" type="button">すべて表示</button>
            <button class="btn-ghost" id="hide-all-btn" type="button">すべて隠す</button>
        </div>

        <div class="stack">
            <button class="btn-ghost" id="king-btn" type="button">王様と指令を決める</button>
            <button class="btn-ghost" id="reorder-btn" type="button" hidden>指令だけ引き直す</button>
        </div>

        <div id="king-result" aria-live="polite"></div>

        <details style="margin-top:1.4em; text-align:left;">
            <summary class="muted" style="cursor:pointer;">指令リストを編集</summary>
            <textarea id="orders-input" style="margin-top:8px;" rows="6"></textarea>
            <p class="count-hint" id="orders-count"></p>
        </details>
    </main>

    <p class="app-footer">© <span id="year"></span> ことほぎ / <a href="/">Kotohogi</a></p>

    <script>
        "use strict";
        const P = window.PartyLogic;
        const ORDERS_KEY = "kingGameOrders";
        const DEFAULT_ORDERS = [
            "みんなで乾杯！",
            "隣の人と握手する",
            "一発ギャグを披露する",
            "好きな食べ物を発表する",
            "王様の物マネをする",
            "最近うれしかったことを話す",
            "全員で記念写真を撮る",
            "新郎新婦へお祝いのひと言",
        ];
        const U = window.PartyUI;
        let deal = null; // { numbers:[], king }
        let lastOrder = null;

        function renderCards() {
            const box = document.getElementById("cards");
            if (!deal) { box.innerHTML = ""; return; }
            box.innerHTML = deal.numbers.map((num, seat) => `
                <div class="king-card${num === deal.king ? " is-king" : ""}" data-seat="${seat}">
                    <span class="seat">席${seat + 1}</span>
                    <span class="back">?</span>
                    <span class="num">${num}</span>
                    <span class="crown">KING</span>
                </div>
            `).join("");
            box.querySelectorAll(".king-card").forEach((el) => {
                el.addEventListener("click", () => el.classList.toggle("revealed"));
            });
        }

        function dealCards() {
            const raw = parseInt(document.getElementById("count-input").value, 10) || 2;
            const count = Math.max(2, Math.min(30, raw));
            if (raw !== count) U.toast("人数は 2〜30 名の範囲にしました");
            deal = P.kingGame(count);
            lastOrder = null;
            document.getElementById("king-result").innerHTML = "";
            document.getElementById("reorder-btn").hidden = true;
            renderCards();
            syncHints();
        }

        function orders() {
            const list = U.parseLines(document.getElementById("orders-input").value).items;
            return list.length ? list : DEFAULT_ORDERS;
        }

        function syncHints() {
            U.setHint("count-hint", deal ? deal.numbers.length + "名にカードを配りました" : "");
            U.setHint("orders-count", "指令 " + U.formatCount(orders().length, "件"));
        }

        function showKing(order) {
            lastOrder = order;
            document.getElementById("king-result").innerHTML = `
                <div class="result-box">
                    <p class="tag">王様は</p>
                    <p class="result-big">${deal.king} 番！</p>
                    <p class="muted" style="margin-top:10px;">指令：${U.escapeHtml(order)}</p>
                </div>
            `;
            document.getElementById("reorder-btn").hidden = false;
            document.querySelectorAll(".king-card.is-king").forEach((el) => el.classList.add("revealed"));
        }

        function decideKing() {
            if (!deal) dealCards();
            const { value } = P.drawOne(orders());
            showKing(value);
        }

        function setAllRevealed(revealed) {
            document.querySelectorAll(".king-card").forEach((el) =>
                el.classList.toggle("revealed", revealed));
        }

        document.getElementById("deal-btn").addEventListener("click", dealCards);
        document.getElementById("king-btn").addEventListener("click", decideKing);
        document.getElementById("reorder-btn").addEventListener("click", () => {
            // 王様はそのままに、指令だけ引き直す（同じ指令の連続は避ける）
            const { value } = P.drawDifferent(orders(), lastOrder);
            showKing(value);
        });
        document.getElementById("reveal-all-btn").addEventListener("click", () => setAllRevealed(true));
        document.getElementById("hide-all-btn").addEventListener("click", () => setAllRevealed(false));
        document.getElementById("count-input").addEventListener("input", syncHints);
        document.getElementById("orders-input").addEventListener("input", () => {
            localStorage.setItem(ORDERS_KEY, document.getElementById("orders-input").value);
            syncHints();
        });
        U.initFooterYear();

        const savedOrders = localStorage.getItem(ORDERS_KEY);
        document.getElementById("orders-input").value = savedOrders != null ? savedOrders : DEFAULT_ORDERS.join("\n");
        dealCards();
    </script>
    <script src="/cf-web-analytics.js" defer></script>
</body>
</html>
